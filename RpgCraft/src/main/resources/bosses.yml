# ============================================================
#  보스 정의. /rpg관리 boss spawn <id>
#  skills.type: SLAM(주변 강타) METEOR(대상 위치 폭발) SUMMON(소환) PULL(끌어당김) BLINK(뒤로 순간이동)
#    v5.6.0: VOLLEY(직선 일제 사격, speed=속도) BACKSTEP_VOLLEY(뒤로 물러나 화살) CHECKER(바둑판 2단 폭발) SAFE_ZONE(초록 원만 안전)
#            DONUT(안쪽↔바깥 교대) SWEEP(회전 베기) WAVE_WALL(틈 있는 벽) GUST(부채꼴 밀치기) FRONT_BACK(앞뒤 베기) SPREAD(낙뢰 표식)
#    기술이 터진 직후 보스는 잠깐 경직됩니다 (config: bosses.stagger-ticks)
#  보스 이름/드롭 세트는 나무위키 4R 기준, 체력·스킬 수치는 자체 설계
# ============================================================

