  require-matching-pack: true  # 외부 리소스팩(resourcepack.url)이 플러그인 내장 팩과 다르면 모델을 끔 (예전 팩이면 여러 마리가 겹쳐 보임)
  vanilla: true              # v5.10.34 바닐라 몬스터 · 야생 동물도 블록을 쌓은 모델로 (좀비 · 스켈레톤 · 크리퍼 · 거미 · 소 · 돼지 · 양 · 닭 …)
  vanilla-range: 40          # 플레이어가 이 거리 안에 있는 바닐라 몹에만 모델을 붙임 (멀어지면 +24 블록에서 뗌)
  vanilla-types: {}          # 특정 종류만 끄기: 예) vanilla-types: { an_sheep: false, vn_slime: false }
boss-models:                # 보스 3D 모델 (리소스팩)
  enabled: true
