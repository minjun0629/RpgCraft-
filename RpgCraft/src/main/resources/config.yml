  balrog-min-level: 120

bgm:                        # 상황별 배경음악 (v5.5.0) — 곡 넣는 법은 README "배경음악" 참고
  enabled: true
  volume: 0.7                # 소리 설정의 "음반" 볼륨과 곱해짐
  town-radius: 150           # 월드 스폰에서 이 거리 안 = 마을 음악
  town-worlds: []            # 이 월드에 있으면 항상 마을 음악 (로비 월드 등)
  dungeon-worlds: []         # 이 월드에 있으면 항상 던전 음악 (신전 월드 등)
  battle-min-mobs: 2         # 주변(14칸) 몬스터가 이만큼 이상일 때 싸우면 전투 음악
  battle-hold-seconds: 15    # 마지막 전투 뒤 이만큼 전투 음악 유지
  tracks: {}                 # 직접 추가: field: ["mypack:music.forest:180"]  (사운드 이름:길이초)
  fallback:                  # 그 상황의 곡이 팩에 없을 때 틀 게임 내장 음악 (빈 칸 = 게임 기본 음악)
    town: ""
    field: ""
    battle: "minecraft:music_disc.otherside"
    boss: "minecraft:music.dragon"
    dungeon: "minecraft:music_disc.pigstep"
  fallback-seconds: 170

rebirth:                    # 환생 (Lv.300 → Lv.1)
  max: 5
  core-pct: 30               # 1회마다 힘·민첩·모험 +30%
  exp-pct: 50                # 1회마다 경험치 획득 +50%
  stat-points: 2             # 1회마다 레벨업 스탯 포인트 +2
  shop-points: 10            # 1회마다 환생 포인트 (환생 상점: /환생 상점)

quest-npcs:
