  weekend-exp:
    enabled: true            # 토 · 일요일 경험치 이벤트
    mult: 1.5                # 경험치 배율

duel:                        # PVP (1대1 결투, /pvp <닉네임>)
  time-limit-seconds: 180    # 제한 시간 (끝나면 무승부)
