  fame-k: 32                 # v5.10.45 명성 변화 크기 (Elo K) — 강한 상대를 이길수록 많이 오름
  fame-pair-daily: 3         # 같은 상대와 하루 몇 판까지 명성 반영 (짜고 치기 방지)

sea:
  megalodon-chance: 0.004    # 바다에서 헤엄칠 때 20초마다 메갈로돈 확률
  megalodon-cooldown-minutes: 20
  kraken-chance: 0.0005      # 20초마다 크라켄 확률 (월드보스급)
  kraken-cooldown-minutes: 120
  fishing-megalodon-chance: 0.003   # 낚시에 성공할 때마다 메갈로돈 확률 (0.3%, 어디서든)
  fishing-kraken-chance: 0.0005     # 낚시에 성공할 때마다 크라켄 확률 (0.05%, 어디서든)

bosses:
  exp-levels: 2.5           # 보스 처치 경험치 = 보스 레벨에서 필요한 경험치 × 이 값 (참가자끼리 나눔, 0 이면 bosses.yml 값)
  world-exp-levels: 4        # 월드보스는 이 값
  signature-min-level: 80    # 이 레벨 이상 보스는 고유 대형 패턴(십자 광선 · 파멸의 고리 · 유성 폭격 · 칼날 폭풍) 사용
  damage-mult: 1.15          # 모든 보스 피해 배율
  crowd-skill-speed: 0.25    # 보스 주변 1명 늘 때마다 기술 간격 -25% 가량
  crowd-defense: 0.3         # 보스 주변 1명 늘 때마다 보스가 받는 피해 ÷(1+0.3)
  chase-radius: 48           # 보스가 쫓아가는 거리 — 이보다 멀어진 플레이어는 포기
  leash-radius: 0            # 등장 위치에서 이만큼 넘게 끌려가면 제자리로 돌아감 (0 = 끔, 기본 끔)
  stagger-ticks: 0          # 기술이 터진 직후 보스 경직 시간 (틱, 20 = 1초). 0 = 경직 없음 (v5.7.3 기본값). 켜면 등급별로 x1.5 / x1 / x0.7 / x0.5
  # v5.7.0 보스 등급: 1 = Lv.40 미만 · 2 = 80 미만 · 3 = 140 미만 · 4 = 그 이상 (월드 보스는 한 등급 위)
  #   등급이 높을수록 기술을 더 자주 쓰고, 연계(콤보, 등급 2 15% · 3 35% · 4 55%)로 이어 씀
  ultimates: true            # 등급 3 은 체력 50%, 등급 4 는 75 · 45 · 15% 와 50초마다 궁극기 (파멸의 주문 · 대붕괴 · 심판의 광선 · 운석 폭풍)
  tier4-double-cast: 0.1     # 등급 4 보스가 기술 두 개를 겹쳐 쓸 확률 (v5.9.7: 0.25 → 0.1)
  max-fly-height: 8          # v5.10.8 나는 보스(하피 여왕 · 붕붕이 등)가 땅에서 이 칸보다 높이 뜨지 않게 (0 = 제한 없음). 공중에서 아래로 기술을 씀
  cast-gap-seconds: 1.6      # v5.9.7 기술이 터진 뒤 다음 기술까지 쉬는 시간 (기술끼리 겹쳐 난사하지 않게). 낮출수록 어려움
  minion-exp-mult: 0.05      # 보스가 소환한 부하 몬스터의 경험치 배율 (1 = 같은 레벨 일반 몬스터와 같음, v5.9.6: 0.4 → 0.05)
  spawn-safe-radius: 300     # 월드 스폰(v5.10.58 왕국을 지었으면 성 밖)에서 이 거리(칸) 안에는 필드 보스 · 바다 보스 · 월드보스 · 토벌전 보스가 나오지 않음 (0 = 제한 없음, 관리자 소환 · 던전 제외)

dummy:
  minutes: 10                # 허수아비가 사라지기까지

auction:
