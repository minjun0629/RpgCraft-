# ============================================================
#  전용 리소스팩 (아이템 모델 · 메뉴 배경)
#  tools/build_resourcepack.py 로 만든 팩이 플러그인에 내장되어 있습니다.
#  직접 수정한 팩을 쓰려면 plugins/RpgCraft/resourcepack.zip 을 교체 후 /rpg관리 pack reload
# ============================================================
resourcepack:
  enabled: true
  required: false            # true 면 거절 시 접속 불가 (+ GUI 배경 자동 사용)
  kick-on-decline: true
  prompt: "&6RpgCraft &f전용 리소스팩을 적용합니다. &7(아이템 모델 · 메뉴 디자인)"
  send-delay-ticks: 20
  url: "https://github.com/minjun0629/RpgCraft-/blob/main/RpgCraft-ResourcePack.zip"   # 외부 호스팅 주소 (GitHub 파일 페이지 주소도 자동으로 직접 다운로드 주소로 변환). 비우면 내장 웹서버(8765) 사용
  sha1: ""                   # 비워두면 서버가 시작할 때 외부 파일을 받아 자동 계산
  url-version: true          # 외부 주소 뒤에 ?v=해시 를 붙여 예전 파일(캐시)을 받지 않게 함 (문제가 생기는 호스팅이면 false)
  refresh-minutes: 10        # 외부 팩 해시를 이 간격마다 다시 확인 (GitHub 의 zip 을 바꿔도 재시작 없이 반영)
  self-host:
    enabled: true
    host: "auto"             # auto: 플레이어가 접속한 주소(IP/도메인)를 그대로 사용 → 어느 IP로 접속해도 적용됨
    port: 8765               # 방화벽/포트포워딩에서 이 포트(TCP)를 열어야 함
  assume-installed: false     # true: 플레이어가 리소스팩을 직접 설치한 경우 (서버에서 보내지 않아도 HUD·메뉴 배경 사용)
  use-custom-file: false     # true: plugins/RpgCraft/resourcepack.zip 을 직접 수정해 쓸 때 (자동 최신화 끔)
  welcome-title: true        # 리소스팩 적용 완료 시 로고 타이틀
  gui-overlay: auto          # auto: 리소스팩을 적용한 플레이어에게만 메뉴 전용 배경 / true: 모두 / false: 끔
  title-color: "&f"
