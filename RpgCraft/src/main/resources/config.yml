# ============================================================
#  RpgCraft 플러그인 설정
#  (나무위키 공개 수치 = [위키], 비공개라 자체 설계 = [설계])
# ============================================================

player:
  start-hp: 20               # 1레벨 체력 (전체 체력·몬스터 피해·회복량이 이 비율로 환산됨)
  base-hp: 1000              # [설계] 1레벨 기본 체력 (내부 단위)
  hp-per-level: 25           # 레벨업당 체력 (체력은 모험으로)
  stat-per-level: 5          # [위키] 레벨업당 스탯 +5
  gambler-stat-per-level: 30 # [위키] ??? 패시브 '도박사'
  base-attack: 5
  str-atk-per-2: 5           # 힘 2 = 공격력 +5
  dex-crit-per-point: 0.12   # 민첩 1 = 크리티컬 +0.12%
  adv-hp-per-point: 90       # 모험 1 = 체력 +90 (체력은 모험으로 올리는 구조)
  adv-def-per-point: 0.065   # 모험 1 = 방어력 +0.065%
  str-magic-per-point: 2     # 힘 1 = 마력 +2 (무기 스킬 위력)
  dex-critdmg-per-point: 0.7 # 민첩 1 = 치명타 피해 +0.7%
  dex-speed-per-point: 0.05  # 민첩 1 = 이동속도 +0.05%
  dex-speed-max: 30
  max-defense: 90            # 방어력(%) 상한
  max-level: 300
  exp:                       # [설계] 필요 경험치 = base * Lv^power + flat
    base: 100
    power: 1.4
    flat: 50
  regen-percent: 2           # 비전투 시 초당 최대 체력의 %
  regen-combat-percent: 0.2  # 전투 중 초당 회복 %
  regen-delay-seconds: 8     # 마지막 전투 후 이 시간이 지나면 비전투
  lock-food: true            # 배고픔 고정
  starting-money: 0          # 처음엔 0원부터
  exp-gain-mult: 0.8         # 모든 경험치 획득 배율
  lifesteal-mult: 0.85       # v5.10.34 모든 흡혈량 배율 (소폭 너프)
  item-hp-mult: 0.4          # 장비·룬·장신구·패시브의 체력(고정·%) 효과 배율 (크게 너프)
  rune-hp-mult: 1.5          # 룬의 체력 효과만 추가로 ×1.5
  speed-mult: 0.7            # 이동속도 증가 효과 배율
  starter-kit:
    - weapon_club
    - tool_gather_1
    - potion_1:5

combat:
  pvp: true
  newbie-protection-level: 10   # 이 레벨 미만은 PvP 보호
  guild-friendly-fire: false
  environment-scale: 0.6        # 낙하/화염 등 환경 대미지 배율 (바닐라 20하트 대비 최대 체력 비율)
  damage-indicator: true

death:
  keep-inventory: true
  money-loss-percent: 0

mobs:
  enabled-worlds: []         # 비워두면 모든 월드
  name-display:              # 몬스터 이름표 (레벨 · 이름 · 체력바) — 때리지 않아도 표시
    near: 16                 # 플레이어 주변 이 거리 안의 몬스터 (0 = 끔)
    look: 32                 # 플레이어가 바라보는 몬스터 (0 = 끔)
  witch-poison-seconds: 7    # 일반 마녀가 던지는 독 물약의 최대 지속 시간 (바닐라 45초)
  level:
    base: 1
    blocks-per-level: 40     # 월드 스폰에서 40블록 멀어질 때마다 +1레벨
    max: 110
    random-spread: 2
  world-overrides:           # 월드별 레벨 시작값 (예: 네더는 50부터)
    world_nether:
      base: 50
      blocks-per-level: 20
    world_the_end:
      base: 90
      blocks-per-level: 20
  hp:                        # [설계] base * (1 + growth*Lv)^2 × (1 + (Lv-100)/high-level-step)
    high-level-step: 60
    base: 110
    growth: 0.12
  damage:                    # [설계] base * (1 + growth*Lv)^1.5 × (1 + (Lv-100)/high-level-step)
    high-level-step: 100
    base: 40
    growth: 0.15
  exp:
    base: 8
    growth: 0.2
  defense-per-level: 0.2
  money-per-level: 100
  crystal-chance: 0.06
  loot-chance: 0.35
  money-random-min: 0.6      # 처치 돈 = 기본값 × (최소~최대 배율 사이 무작위)
  money-random-max: 1.5
  no-baby-zombies: true
  sun-burn: false
  creeper-reward-mult: 0.5   # 크리퍼가 자폭하면 경험치·돈·전리품 절반
  weak-skills: true
  potential-scroll-chance: 0.0007   # 모든 몬스터 잠재능력 부여 주문서 확률 (0.07%)
  damage-mult: 1.2           # 모든 몬스터 피해 배율
  damage-mult-lv15: 1.15     # Lv.15 이상 몬스터 추가 피해 배율
  passive-until-hit: true    # 몬스터는 먼저 맞기 전엔 플레이어를 공격하지 않음 (웨이브·던전·보스 제외)
  high-level-loot-mult: 0.6  # Lv.100 이상 몬스터 전리품·희귀 드롭 추가 배율          # 일반 몬스터도 약한 기술 사용 (돌진·연사·도약 등)
  level-gap-resist-base: 0.95   # 몬스터가 나보다 높은 레벨 1마다 내 피해 ×0.95 (10레벨 ≈ 60%, 30레벨 ≈ 21%, 60레벨 ≈ 5%)
  level-gap-floor: 0.02         # 최소 2%
  level-gap-damage: 0.06        # 몬스터가 나보다 높은 레벨 1마다 받는 피해 +6%
  level-gap-damage-cap: 8       # 최대 8배
  overlevel-free: 20            # 나보다 20레벨 넘게 낮은 몬스터는 경험치 1레벨당 -3% (최소 10%)            # false: 낮에 좀비·스켈레톤 등이 햇빛에 타지 않음
  creeper-hp-mult: 0.35      # 크리퍼 체력 배율 (자폭해도 마지막으로 때린 플레이어가 보상 획득)
  creeper-exp-mult: 1.5
  normal-exp-mult: 0.75      # v5.10.34 일반(정예 · 중간 보스 아닌) 몬스터 경험치 배율
  elite-chance: 0.07         # 정예 몬스터 확률 (밤 ×1.5, 핏빛 달 ×3)
  miniboss-chance: 0.012     # 중간 보스 확률
  miniboss-legend-seal-chance: 0.002
  normal-rare-drop-mult: 0.4 # 일반 몬스터의 희귀 아이템(중급 이상 결정·마력 핵·룬·권·장신구·보물 지도 등) 드롭 확률 배율
  elite-min-level: 5         # 이 레벨 미만 몬스터는 정예가 되지 않음
  miniboss-min-level: 15     # 이 레벨 미만 몬스터는 중간 보스가 되지 않음
  legend-seal-min-level: 70  # 중간 보스가 레전더리 각인석을 떨어뜨리는 최소 레벨
  elite-scale: 1.25          # 정예 크기 (슬라임·팬텀은 크기 값, 1.20.5+ 서버는 모든 몹)
  miniboss-scale: 1.6        # 중간 보스 크기          # 일반 몬스터 전리품 드롭 확률        # 하급/중급/상급/최상급 결정 드롭 확률
  clear-vanilla-drops: true

boss:
  min-contribution: 0.07     # 보스 보상(돈 · 재료)을 받기 위한 최소 기여도(7%)
  exp-min-contribution: 0.02 # 보스 경험치를 받기 위한 최소 기여도(2%)
  exp-even-share: 0.75       # 경험치의 이 비율은 참가자끼리 똑같이, 나머지는 기여도대로
  exp-max-share: 0.4         # 한 사람이 받는 경험치 상한 (3명 이상 40%, 2명이면 60%). 넘는 몫은 나머지에게

enhance:
  max-normal: 30             # 모든 장비 최대 +30
  max-legend: 30
  # [설계] 현재 강화 단계(+0 ~ +14)별 성공 확률(%)
  success: [95, 90, 85, 80, 75, 70, 65, 60, 50, 45, 40, 35, 30, 25, 20, 18, 16, 14, 12, 10, 9, 8, 7, 6, 5, 4, 3, 3, 2, 2]
  # [위키] +8 강화 시도부터 파괴 확률 발생 / 수치는 [설계]
  destroy: [0, 0, 0, 0, 0, 0, 0, 0, 10, 20, 30, 40, 50, 50, 50]
  fail-down-from: 5          # 이 단계 이상에서 실패 시 하락 가능
  fail-down-chance: 0.5
  money-base: 2000           # 비용 = money-base * (단계+1)^2
  weapon-atk-per-level: 0.08 # 무기 강화당 공격력 +8% (+5 고정)
  shield-atk-per-level: 0.04
  armor-def-per-level: 0.3
  armor-hp-per-level: 50
  blacksmith-bonus: 5        # 대장장이 강화 확률 보너스

blacksmith:
  required-level: 20
  cost: 1000000

potion:
  swap-key: true             # F 키 = 포션가방 사용, 쉬프트+F = 메인 메뉴
  cooldown-seconds: 2

spirit:
  shards-per-crystal: 5      # [위키] 기운 파편 5개 = 기운 뽑기 결정
  crystal-chance: 0.3        # [위키] 결정 우클릭 시 30%
  essence-per-weapon: 5      # [위키] 기운 5개 + 유니크 무기
  essence-per-armor: 3       # [설계]

gather:
  cooldown-by-tier: [180, 150, 120]   # 채집 재사용 대기시간(초): 초급 · 중급 · 상급 도구
  shard-chance: 0.02         # 채집 시 자연/땅 기운 파편 확률
  nodes:
    herb:
      blocks: [DIRT, GRASS_BLOCK, COARSE_DIRT, PODZOL, ROOTED_DIRT, MYCELIUM, MUD, DIRT_PATH]   # 흙을 캐면 약초·버섯
      drops:                 # 가중치. 상위 채집도구일수록 희귀 재료 가중치 증가
        herb_weed: 60
        herb_mushroom: 20
        herb_bell: 10
        herb_star: 6
        herb_ginseng1: 3
        herb_ginseng10: 0.8
        herb_ginseng100: 0.2
    wood:
      blocks: [OAK_LOG, SPRUCE_LOG, BIRCH_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG]
      drops:
        wood_log: 85
        wood_glow: 14
        wood_gold: 1
    ore:
      blocks: [STONE, DEEPSLATE, COAL_ORE, IRON_ORE, GOLD_ORE, DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_IRON_ORE, DEEPSLATE_GOLD_ORE, DEEPSLATE_DIAMOND_ORE]
      drops:
        mat_stone: 50
        mat_iron: 30
        mat_silver: 12
        mat_gold: 5
        mat_crystal: 2.5
        ore_black: 0.1
        ore_green: 0.1
        ore_red: 0.1
        ore_blue: 0.1
        ore_gray: 0.1

guild:
  allow-player-create: true  # false 면 rpgcraft.guild.create 권한자만 생성 (원작은 스트리머가 길드장 지정)
  create-cost: 1000000
  levelup-cost-base: 5000000 # 레벨업 비용 = base * 현재 레벨 (길드 금고에서 차감)
  max-level: 10              # v5.10.20 5 → 10 (레벨업에 길드 경험치도 필요)
  exp-per-level: 3000        # v5.10.20 다음 레벨 길드 경험치 = 이 값 × 레벨² (길드원 사냥 1 · 커스텀 2 · 보스 100 · 공성전 승리 · 성 수입)
  skill-reset-cost: 10000000 # 길드 스킬 초기화 비용 (길드 금고)

war:
  demolish-on-disband: true  # v5.10.10 길드가 사라지면 그 길드가 차지한 공성 성도 허물고 짓기 전 땅으로 (false = 소유만 비움)
  demolish-on-reset: true    # v5.10.10 /rpg관리 reset all confirm (전체 초기화) 때 공성 성도 모두 허묾
  prepare-seconds: 600
  duration-seconds: 1200
  walls-required: 3          # [위키] 성벽 3개 파괴 후 신호기 파괴 시 승리 (0 = 전부)
  guild-walls-max: 6         # v5.10.14 성벽 설치권으로 한 성에 더 세울 수 있는 성벽 수
  guild-wall-hp-small: 30000 # 성벽 설치권(소형)으로 세운 성벽 체력
  guild-wall-hp-large: 60000 # 성벽 설치권(대형)
  no-mob-spawn: true         # v5.10.13 성 안(성 부지 + no-mob-margin 칸)에서는 몬스터가 생기지 않음 (자연 스폰 · 웨이브 깃발 · 현상금 · 필드 보스)
  no-mob-margin: 4
  castle-spawn-safe-radius: 300   # v5.10.12 월드 스폰(v5.10.58 왕국을 지었으면 성 밖)에서 이 거리(칸) 안에는 castle build 로 성을 지을 수 없음 (성 끝자락 포함, 0 = 제한 없음)
  castle-wall-hp-large: 60000   # /rpg관리 castle build 로 지은 대형 성의 성벽 구간 체력
  castle-build-blocks-per-tick: 20000   # 대형 성을 지을 때 한 틱에 놓는 블록 수 (낮출수록 천천히 · 렉 적게)
  wall-game: true            # v5.10.15 성벽은 채집도구 타이밍 미니게임으로만 깎임 (false = 예전처럼 때리는 대로)
  wall-game-hit-mult: 1.5    # 초록 칸 명중 시 (도구 수치 × 이 배율 × 콤보 배율, 콤보는 최대 ×2)
  wall-game-perfect-mult: 2.5   # 가운데 금색 칸 (완벽)
  wall-damage-mult: 1.0      # 채집도구 성벽 대미지 배율 (도구: 15 / 70 / 100)
  hit-interval-ms: 400
  repair-seconds: 10         # [위키] 성벽 수리 망치 쉬프트 10초
  castle-daily-income: 3000000   # v5.10.20 성 하나당 하루 수입 (성을 가진 길드 금고로, 하루 한 번)
  castle-daily-guild-exp: 500    # 성 수입 때 길드 경험치
  win-guild-exp: 2000            # 공성전 승리 길드 경험치
  castle-buff-max-stack: 2       # 성 소유 버프가 겹치는 성 수
  castle-buff:                   # 성을 가진 길드의 길드원 버프 (성 하나당)
    atk-pct: 5                   # 힘 · 민첩 · 모험 %
    hp-pct: 5
    exp-pct: 10
  declares-per-round: 1
  loot-percent: 30           # 승리 시 패배 길드 금고 약탈 %
  win-reward: 10000000       # 승리 길드 금고 보상
  max-wall-blocks: 30000

world-protection:           # 야생 방지
  enabled: true
  regen-seconds: 5          # 캔 블록이 다시 생기기까지 (초). 드롭은 없음
  worlds: []                 # 비우면 모든 월드. 특정 월드만: [world]
  exclude-worlds: []         # 야생을 허용할 월드 (예: 자원 월드)
  max-restore-per-second: 400

jobs:
  base-level: 10             # 기초 직업 선택 레벨
  advance-level: 40          # 2차 전직 레벨
  advance-cost: 500000
  third-level: 100          # 3차 전직 레벨
  third-cost: 10000000       # 3차 전직 비용
  third-cores: 10            # 3차 전직에 필요한 마력 핵

weapon-skills:
  enabled: true
  basic-notice: false        # 평타 스킬 발동 때 액션바에 기술 이름 표시 (끄면 화면을 가리지 않음)
  quick-shot-ms: 1100        # 활 좌클릭 사격 간격
  bow-damage-mult: 1.35      # 활 피해 배율 (사격·활 스킬 모두)
  bolt-range: 14             # 지팡이 평타(마법탄)가 날아가는 거리 (칸, 예전 약 23칸 → 18칸 → 14칸)
  bolt-cooldown-ms: 1100     # 지팡이 평타(마법탄) 간격 (밀리초, 예전 700 → 900 → 1100)
  slash-damage: 0.85         # 좌클릭 참격 피해 (공격력 배율, 무기 공격 간격마다)
  particle-melee: true       # 몬스터를 직접 때려도 바닐라 타격 대신 입자 참격으로 공격
  cooldown: {sword: 6, dagger: 7, axe: 9, shield: 8, bow: 6, spear: 6, club: 6}
  shift-left-cd: 8           # 희귀 이상: Shift+좌클릭 (돌진 베기 / 후퇴 사격)
  shift-right-cd: 12         # 희귀 이상: Shift+우클릭 (충격파 / 화살비)
  ultimate-cd: 60            # 레전드 이상: 쉬프트 두 번 = 궁극기

field-wave:
  enabled: true
  chance-per-30s: 0.08       # 30초마다 플레이어별 깃발 등장 확률
  stage-seconds: 150         # 웨이브 한 단계 제한 시간
  revives: 1                 # 웨이브 중 부활 횟수 (초과해서 쓰러지면 탈락)
  arena-radius: 18           # 원형 전장 반경 (밖으로 나가면 안쪽으로 밀림)
  min-spawn-distance: 64     # 월드 스폰 근처에는 깃발이 생기지 않음
  exp-ratio: 0.3             # 보상 경험치 = 다음 레벨 필요량 × 비율
  money-per-level: 3000

hidden-merchant:
  enabled: true
  interval-minutes: 30
  stay-minutes: 5
  radius: 400                # 첫 번째 월드 스폰 기준 등장 반경
  reveal-direction: false    # true: 등장 알림에 방향·거리 표시 + 나침반 ✦ 표시 / false: 비공개 (근처에서 기척만)
  sense-radius: 500          # 이 거리 안에 들어오면 "기척이 느껴진다" 알림

board:                       # v5.10.45 보드게임 (/보드게임) — 윷놀이 · 부루마블 · 인디언 포커 (컴퓨터와 1대1, 판 수 제한 없음)
  daily-chip-cap: 60         # 하루에 얻을 수 있는 보드 칩
  reward:
    yut: {win: 8, lose: 2}
    marble: {win: 12, lose: 2}
    poker: {win: 8, lose: 2}
  yut-pieces: 2              # 윷놀이 말 개수 (1~4)
  marble-start-money: 1500
  marble-salary: 200
  marble-rounds: 20
  poker-chips: 10
  poker-rounds: 15

ruins:                       # v5.10.45 유적 · 보물 상자 도전 조건
  requirement: either        # either: 모험 스탯과 탐험도 중 높은 쪽 / explore: 탐험도만 / adv: 예전처럼 모험만
                             # 탐험도 = 걸은 거리 · 몬스터 처치 · 채집 · 낚시 · 도감 발견 · 유적 클리어 · 보물 상자 (항목마다 상한, /숙련 에서 확인)

structures:
  natural-chance: 0.004      # 새 청크가 생성될 때 장식 구조물이 생길 확률
  max-natural: 25            # 동시에 존재할 수 있는 자연 구조물 최대 수
  min-distance: 300          # 자연 구조물 사이 최소 거리 (블록)
  despawn-minutes: 10
  random-minutes: 20
  ruin-target: 6             # 유적(점프맵)이 이 수보다 적으면 자동 생성
  ruin-minutes: 15           # 유적 자동 생성 검사 간격         # 이 시간마다 무작위 플레이어 근처(150~400칸)에 구조물 하나        # 보물 상자가 처음 열린 뒤 구조물이 사라지기까지 (분). 관리자가 지은 구조물은 영구
  castle-wall-hp: 30000
  ruin-steps: 48             # 점프맵 유적 발판 수 (쉼터·사다리 구간 포함)
  adv-per-blocks: 25         # 스폰에서 25블록 멀어질 때마다 필요 모험 +1 (5 단위 반올림)
  max-adv: 250
  ruin-min-adv: 10           # 유적·보물 상자 최소 모험 제한

trade:
  max-distance: 16

escape:
  cooldown-seconds: 120

kingdom:                    # v5.10.56 스폰 왕국 (/rpg관리 kingdom build confirm)
  no-mobs: true             # 왕국 안 (스폰 둘레 half 칸) 에서는 몬스터가 자연적으로 생기지 않음 (짓기 전에도 스폰 둘레에 적용)
  half: 500                 # 반너비 (1000 x 1000)
  ms-per-tick: 30           # 짓는 동안 한 틱에 쓸 시간 (클수록 빨리 짓지만 서버가 느려짐)
  level-from-wall: true     # 왕국을 지은 월드: 몬스터 레벨을 스폰이 아니라 왕국 부지 끝(성 밖)부터 셈 → 성 밖 바로 앞이 Lv.1, mobs.level.blocks-per-level 칸마다 +1

constellation:              # v5.10.59 별자리 특성 트리 (/별자리)
  shards-per-level: 1       # 레벨 업마다 별 조각
  shards-per-boss: 3        # 보스 처치 (근처 48칸 참여자 모두)
  cost-mult: 1.0            # 별 밝히는 비용 배율 (별자리 하나 다 밝히면 기본 248 조각)
  reset-cost: 3000000       # 초기화 비용 (쓴 조각은 모두 돌려받음)

souls:                      # v5.10.59 몬스터 영혼석 (/영혼석)
  enabled: true
  chance: 0.004             # 일반 몬스터 영혼석 확률 (0.4%)
  elite-mult: 5             # 정예 · 중간 보스 배율
  boss-chance: 0.35         # 보스 (근처 48칸 참여자마다)

showoff:                    # /자랑 (손에 든 아이템을 채팅에 자랑, 아이템 보기 버튼)
