  stay-minutes: 30
  spread: 1200               # 스폰에서 400 + 0~1200칸
  bosses: [desert_nightmare, siphonia, kain]

mounts:
  draw-cost: 3000000         # 탈것 뽑기 1회 비용 (300만 원)
  odds: [0.63, 0.26, 0.10, 0.01]    # 등급 확률 (일반 / 희귀 / 영웅 / 전설 1%)
  speed: [0.24, 0.29, 0.34, 0.40]   # 등급별 이동 속도 (일반 / 희귀 / 영웅 / 전설)
  jump: [0.55, 0.7, 0.85, 1.0]      # 등급별 점프력 (말 점프 강도)
  fly-speed: 0.75            # 전설 탈것 비행 속도 (블록/틱)
  seat-height: 1.45          # 안장 높이 (블록) — 탈것 모델 크기가 이 높이에 맞춰짐
  scale-mult: 1.0            # 모델 크기 추가 배율
  ride-height: 1.2           # 모델이 붙는 높이 (말 키 × 0.75). 모델이 땅에 묻히거나 뜨면 조절
  model-lift: 0.0            # 모델 전체를 위(+)/아래(-)로 미세 조정

boss-crystal:               # 보스 수정 (마크에이지식): 보스 토벌 시 확률로 시체 자리에 수정이 떨어짐, 우클릭하면 확률로 장비
  drop-chance: 0.3           # 수정이 떨어질 확률 (30%)
  max-items: 2               # 수정 1개에서 한 번에 나오는 장비 최대 개수
  chance-mult: 1.0           # 장비 확률 배율 (bosses.yml 의 드롭 확률 × 이 값, 장비마다 따로 판정)

necromancer:                 # v5.10.9 히든 직업 네크로맨서 (C 계열) 군단 — /군단
  soul-chance: 0.05          # 네크로맨서가 커스텀 몬스터를 잡을 때 그 몬스터의 영혼이 남을 확률
  souls-per-raise: 12        # 군단원 하나를 일으키는 데 드는 같은 종류 영혼 수
  essence-per-raise: 300     # 일으키는 데 드는 사령 정수 (몬스터 1 · 커스텀 3 · 보스 60 씩 모임)
  raise-success: [0.5, 0.6, 0.7]   # 의식 성공 확률 (네크로맨서 1 · 2 · 3단계). 실패하면 재료가 사라짐
  slots: [3, 5, 8]           # 군단 자리 수 (단계별)
  upkeep-per-minion: 2       # 소환 중 1분마다 드는 사령 정수 (군단원 하나당, 등급이 높을수록 × (등급+1))
  revive-minutes: 5          # 쓰러진 군단원을 다시 부를 수 있을 때까지 (분)
  revive-essence: 100        # 즉시 부활 비용 (× 등급+1)
  upgrade-essence: 150       # 강화 비용 (× 다음 강화 수치)
  summon-cooldown: 20        # 군단을 거둔 뒤 다시 부를 수 있을 때까지 (초)
  model-scale: 0.9           # 군단원 모델 크기 (원래 몬스터 대비)

season-pass:                 # v5.10.20 시즌 패스 (/시즌패스) — 회차가 바뀌면 새 시즌
  enabled: true
  exp-per-level: 150         # 패스 1레벨에 필요한 경험치 (사냥 1 · 커스텀 2 · 보스 100 · 낚시 3 · 미니게임 15 · 요리 5 · 공성전 승리 300)
  exp-mult: 1.0
  premium-cost: 30000000     # 프리미엄 패스 가격 (시즌마다)

mail:                        # v5.10.20 우편함 (/우편)
  fee: 1000                  # 플레이어가 보낼 때 수수료
  expire-days: 30            # 받지 않은 우편이 사라지기까지

hidden-weapon:               # v5.10.20 히든 직업 전용 무기 제작 (히든 직업창)
