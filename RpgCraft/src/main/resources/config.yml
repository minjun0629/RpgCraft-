  hitbox: true               # 모델 크기에 맞는 판정 상자 (큰 보스를 모델 어디를 때려도 맞음)
  hitbox-mult: 1.0           # 판정 상자 크기 배율
  scale: {}                  # 예) scale: {kain: 2.5, witch: 1.4}  (여기 적은 보스는 size-mult 를 곱하지 않음)
  size-mult: 1.15            # 모든 보스 모델 크기 배율 (v5.8.0 1.15 = 15% 크게, 판정 상자도 같이)

vfx:
  enabled: true              # 스킬 이펙트를 리소스팩 모델로 한 번에 번쩍 (잔상 없음). false: 기존 입자
  layers: true               # 겹 이펙트 (흰 칼심 · 잔상 · 반짝임 · 파동 원판 · 입자). 서버가 버거우면 false
  weapon-extra: true         # 무기 스킬 추가 연출 (속성 입자 · 시전 마법진 · 잔상 · 크레이터 · 화살 꼬리 · 궁극기). 서버가 버거우면 false
  mob-extra: true            # 몬스터 스킬 추가 연출 (차오르는 예고 · 기 모으기 · 크레이터 · 잔상 · 투사체 꼬리). 서버가 버거우면 false
  boss-blocks: true          # 보스 빛나는 바닥 예고판 · 땅이 솟는 지진 · 파편 · 기둥 · 운석 · 밀려오는 벽 (블록 디스플레이, 지형은 안 바뀜). 서버가 버거우면 false
  max-new-per-tick: 12       # v5.9.3 렉 줄이기: 한 틱에 새로 띄우는 연출 조각 수 (바닥 예고판은 제외). 렉이 심하면 더 낮게
  max-active: 48             # 동시에 떠 있는 연출 조각 수 상한 (넘으면 파편 · 지진 · 충격파를 줄여서 띄움)

visual:
  item-glow: false           # 떨어진 장비 발광(벽 너머로도 보임). 끄면 빛기둥·입자만 표시

compass:
  enabled: true              # 화면 위 나침반 (개인 설정에서 끄기 가능)

hud:
  notice-ms: 2200            # HUD 위 알림 표시 시간
  pack-hud: true             # 리소스팩 적용자: 하트/배고픔 자리에 커스텀 체력바·아이콘 HUD (액션바)
  sidebar: true              # 서버 전체 사이드바 사용 여부 (개인은 메뉴 > 설정에서 끄기 가능)

keys:
  sneak-drop-quick-skill: true   # 쉬프트 + Q = 퀵 액티브 스킬 (퀵 스킬을 지정한 경우에만 아이템 버리기 대신 발동)

warp:
  channel-ticks: 60          # 워프 시전 시간 (20틱 = 1초)

# ============================================================
#  전용 리소스팩 (아이템 모델 · 메뉴 배경)
#  tools/build_resourcepack.py 로 만든 팩이 플러그인에 내장되어 있습니다.
#  직접 수정한 팩을 쓰려면 plugins/RpgCraft/resourcepack.zip 을 교체 후 /rpg관리 pack reload
# ============================================================
resourcepack:
  enabled: true
  required: false            # true 면 거절 시 접속 불가 (+ GUI 배경 자동 사용)
  kick-on-decline: true
  prompt: "&6RpgCraft &f전용 리소스팩을 적용합니다. &7(아이템 모델 · 메뉴 디자인)"
  send-delay-ticks: 20
  url: "https://github.com/minjun0629/RpgCraft-/blob/main/RpgCraft-ResourcePack.zip"   # 외부 호스팅 주소 (GitHub 파일 페이지 주소도 자동으로 직접 다운로드 주소로 변환). 비우면 내장 웹서버(8765) 사용
  sha1: ""                   # 비워두면 서버가 시작할 때 외부 파일을 받아 자동 계산
  url-version: true          # 외부 주소 뒤에 ?v=해시 를 붙여 예전 파일(캐시)을 받지 않게 함 (문제가 생기는 호스팅이면 false)
  refresh-minutes: 10        # 외부 팩 해시를 이 간격마다 다시 확인 (GitHub 의 zip 을 바꿔도 재시작 없이 반영)
  self-host:
    enabled: true
    host: "auto"             # auto: 플레이어가 접속한 주소(IP/도메인)를 그대로 사용 → 어느 IP로 접속해도 적용됨
    port: 8765               # 방화벽/포트포워딩에서 이 포트(TCP)를 열어야 함
  assume-installed: false     # true: 플레이어가 리소스팩을 직접 설치한 경우 (서버에서 보내지 않아도 HUD·메뉴 배경 사용)
  use-custom-file: false     # true: plugins/RpgCraft/resourcepack.zip 을 직접 수정해 쓸 때 (자동 최신화 끔)
  welcome-title: true        # 리소스팩 적용 완료 시 로고 타이틀
  gui-overlay: auto          # auto: 리소스팩을 적용한 플레이어에게만 메뉴 전용 배경 / true: 모두 / false: 끔
  title-color: "&f"

# v5.11.0 로열 로드 — 『달빛 조각사』의 가상현실 게임 규칙
royal-road:
  enabled: true
  welcome-title: true        # 접속할 때 "로열 로드 · 베르사 대륙에 오신 것을 환영합니다"
  stat-max: 1000             # 인내 · 예술 · 매력 · 행운 · 신앙 · 통솔력 최대치
  stat-gain-mult: 1.0        # 행동 스탯이 오르는 속도 배율
  fame:
    boss: 3                  # 보스 처치 명성
  death:                     # 사망 페널티 (친선 PVP 는 제외)
    enabled: true
    level-loss: 1            # 죽으면 레벨이 내려감 (이미 찍은 스탯은 다음 레벨 업 때 포인트로 갚음)
    min-level: 20            # 이 레벨 이하에서는 레벨이 내려가지 않음
    skill-loss: 0.3          # 조각술: 이번 단계 숙련도의 30% 를 잃음 (단계는 유지)
    lockout-minutes: 0       # 0 보다 크면 죽은 뒤 그 시간 동안 접속 불가 (소설은 24시간 = 1440) · 관리자 제외
  sculpt:
    max-per-player: 12       # 한 사람이 세울 수 있는 조각품 수
    time-mult: 1.0           # 조각하는 시간 배율
    material-price-mult: 1.0 # /조각 재료 상점 가격 배율
  life:
    level-cost: 1            # 조각 생명부여의 대가 (레벨)
    min-level: 30            # 대가를 치른 뒤에도 이 레벨 이상이어야 함
    revive-minutes: 3        # 쓰러진 생명체를 다시 부를 수 있을 때까지
