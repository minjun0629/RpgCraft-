  hud-x: 320                 # 화면 가운데에서 왼쪽으로 몇 칸 떨어져 그릴지 (화면이 좁으면 줄이기)
  share-radius: 100          # 이 거리 안의 파티원과 기여도(입힌 피해) 비례로 경험치 분배
  exp-bonus-per-member: 0.03 # 파티원 1명당 경험치 +3%

dungeon:
  respawn-minutes: 10        # 클리어한 던전이 사라진 뒤 다른 곳에 새 던전이 생기기까지
  time-limit-minutes: 20
  exp-ratio: 0.5             # 클리어 경험치 = 다음 레벨 필요량 × 비율 × 단계/2
  money-per-tier: 60000      # × 단계 × economy.boss-money-mult

legendary:
  max-per-player: 1          # 한 사람이 가질 수 있는 레전더리 패시브 수
  world-boss-drop-chance: 0.03

pender:                     # 전설의 대장장이 렉스
  interval-minutes: 180      # 3시간마다
  stay-minutes: 10           # 10분 동안

world-boss:                 # 월드보스 출현 (전용 거대 전장과 함께)
