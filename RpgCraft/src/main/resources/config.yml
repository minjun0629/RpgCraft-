  cores: 20                  # 마력 핵
  crystals: 10               # 상급 결정

pets:
  draw-cost: 1500000         # 펫 뽑기 1회 비용
  odds: [0.64, 0.27, 0.08, 0.01]    # 등급 확률 (일반 / 희귀 / 영웅 / 전설 1%)
