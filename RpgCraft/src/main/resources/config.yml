  scale: 0.6                 # 펫 모델 크기
  exp-mult: 1.0              # v5.10.30 펫 경험치 배율 (사냥 1 · 정예 4 · 중간 보스 10 · 보스 40 · 간식 60 · 요리 40)
  evolve-cost: 2000000       # 진화 비용 기준 (× 등급+1 × 다음 단계)
  fuse-count: 5              # v5.10.35 등급 합성에 필요한 같은 등급의 남는 펫 수 (3 → 5)

mastery:                     # v5.10.30 숙련도 (/숙련) — 생활 · 전투 · 직업 각각 최대 50
  exp-mult: 0.6              # v5.10.34 1.0 → 0.6 (덜 오르게)
  gather-exp: 8              # v5.10.44 채집 한 번당 숙련도 경험치 (40 → 8, 약 3,300번 채집하면 50레벨)
  weapon-dmg-per-level: 0.004   # 무기 숙련 1레벨마다 그 무기로 주는 피해 +0.4% (50레벨 +20%)

tower:                       # v5.10.30 무한의 탑 (/탑)
  world: world
  x: 30000                   # 전투장 위치 (하늘 위 · 사람마다 80칸씩 옆으로)
  z: 30000
  y: 260
  floor-seconds: 120         # 층마다 제한 시간
  daily-entries: 10          # 하루 도전 횟수 (0 = 무제한)
  base-level: 8              # 1층 몬스터 레벨 = base + 층 × level-per-floor
  level-per-floor: 3.0
  max-level: 400
  money-per-floor: 5500      # 처음 오른 층 보상 = 층 × 이 값 (10층마다 3배 + 아이템) — v5.10.34 15000 → 8000 · v5.10.53 → 5500
  exp-ratio-per-floor: 0.011 # 층을 넘을 때마다 레벨업 경험치의 1.1% (보스 층 3배) — v5.10.53 0.015 → 0.011
  weekly-money-per-floor: 14000   # 주간 보상: 최고 층 × 이 값 + 순위 보상 (우편) — v5.10.34 40000 → 20000 · v5.10.53 → 14000

server-list:                 # 서버 목록 (멀티플레이 화면)
  enabled: true
  address: ""                # 서버 도메인 (예: play.rpgcraft.kr) — 설명 두 번째 줄에 표시. 숫자 IP 는 표시하지 않음
  auto-address: false        # true 면 주소를 비워 뒀을 때 서버 IP 를 대신 표시 (기본: 표시 안 함)
  show-ip: false             # true 면 address 에 숫자 IP 를 적었을 때도 표시
  motd-line1: "&6&l⚔ RpgCraft &8| &e대규모 RPG · PvP 서버"
  motd-line2: "&f주소: &b{address}"
  motd-line2-no-address: "&7레벨 · 보스 · 길드 · 공성전 · 던전"
  # 아이콘: plugins/RpgCraft/server-icon.png (64x64 PNG) 를 바꾸면 됨

anti-bot:                    # 접속 폭주 · 봇 방어 (진짜 디도스는 호스팅 디도스 방어 / TCPShield 등 프록시로)
  enabled: true
  ip-window-seconds: 30      # 같은 IP 가 이 시간 안에
  ip-max-attempts: 5         # 이만큼 넘게 접속 시도하면
  ip-block-seconds: 120      # 이 시간 동안 차단
  max-accounts-per-ip: 3     # 한 IP 동시 접속 수 (0 = 제한 없음)
  flood-per-10s: 20          # 10초 안에 전체 접속 시도가 이만큼 넘으면
  lockdown-seconds: 60       # 이 시간 동안 처음 오는 사람 접속 잠금

anti-xray-alert:             # 엑스레이 의심 알림 (차단은 Paper anti-xray 설정으로)
  enabled: true
  window-minutes: 30
  min-rare: 12               # 이 시간 안에 다이아 · 고대 잔해 · 에메랄드를 이만큼 이상 캤고
  max-rare-per-100-stone: 4.0   # 돌 100개당 희귀 광석이 이보다 많으면 관리자에게 알림

events:
