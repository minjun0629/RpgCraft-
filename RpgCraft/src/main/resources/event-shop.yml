# ============================================================
#  이벤트 코인 상점 (v5.7.1) — /이벤트 상점
#  상점은 하나이고, 모든 품목을 이벤트 코인으로 삽니다 (미니게임 4종 성공 보상).
#  아래 블록 하나가 상점 창의 한 줄입니다 (최대 4줄 · 한 줄에 최대 7개). name 은 줄 맨 왼쪽에 표시되는 종류 이름.
#  items: item = 아이템 ID (/rpg관리 items 로 확인), amount = 개수, price = 이벤트 코인 가격, limit = 한 사람이 살 수 있는 횟수 (0 = 무제한)
#  icon = 줄 이름 칸의 아이콘 재료
# ============================================================
