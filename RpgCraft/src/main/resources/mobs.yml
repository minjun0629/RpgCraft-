# ============================================================
#  커스텀 몬스터. 자연 스폰 몬스터가 config custom-mobs.chance 확률로 지역 레벨/바이옴에 맞는 몬스터로 바뀝니다.
#  level: 등장 레벨 범위 (월드 스폰에서 멀수록 레벨↑) / biomes: 바이옴 이름 일부 (비우면 어디서나)
#  abilities.type: LEAP 도약 · CHARGE 돌진 · SLAM 내려찍기 · FROST 냉기 폭발 · VOLLEY 화살 난사 · FIREBALL 화염구
#                  BLINK 순간이동 · HEAL 자가 치유 · SUMMON 소환(entity) · POISON_CLOUD 독구름
#  on-hit: 공격 시 상태이상 (POISON, SLOW, WEAKNESS, BLINDNESS, HUNGER, WITHER, FIRE : 초)
#  /rpg관리 mob spawn <id> [레벨] 로 직접 소환
# ============================================================

