# Feature Registry — 정본 (사람이 읽는 요약: 03_FEATURE_REGISTRY.md)
# classification: CANON / SOURCE-BASED / ORIGINAL / RESEARCH_REQUIRED
# status: PLANNED DESIGNED IMPLEMENTING IMPLEMENTED PARTIAL TESTING VERIFIED BLOCKED RESEARCH_REQUIRED PAPER_LIMITATION EXTERNAL_ASSET_REQUIRED
# 규칙 (RegistryAuditTest 가 검사):
#   - IMPLEMENTED 는 tests 에 적힌 테스트 클래스가 실제로 있어야 한다.
#   - VERIFIED 는 실제 Paper 서버 테스트(server_test: PASSED)가 있어야 한다. 이 개발 환경은 Paper · Mojang 서버 다운로드가 막혀 있어 아직 하나도 없다.
#   - IMPLEMENTED = 코드 + 자동 테스트 통과 (서버 테스트 전). PARTIAL = 일부만 있음. 서버 연결 코드(platform)는 서버 테스트 전까지 PARTIAL.

features:
