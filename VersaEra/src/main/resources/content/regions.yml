# 지역 (02_WORLD.md). min/max: [x, y, z]. 겹치면 priority 가 높은 지역이 이긴다.
# purpose(존재 이유)는 필수, 원작 지명(source: CANON)은 changed(후대의 변화)도 필수 — 없으면 로드 실패.
regions:
  central_plains:
    name: 중앙 평원
    source: SOURCE-BASED
    danger: 1
    min: [-2500, -64, -2000]
    max: [2500, 320, 2400]
    priority: 0
    tags: [plains]
    purpose: 황제의 길이 지나는 넓은 평원. 도시 사이를 오가는 이동 자체가 탐험이 되도록 일부러 비워 둔 공간
    resources: [oak_timber, flax_fiber]
  harden:
    name: 하르덴 교역시
    danger: 0
    min: [-300, 40, -300]
    max: [300, 320, 300]
    priority: 20
    parent: central_plains
    tags: [city, market]
    purpose: 황제의 길 세 갈래가 만나는 옛 역참이 커진 대륙 최대 시장. 모든 재료가 모이지만 산지보다 비싸다
    factions: [harden_merchants]
  serven_granary:
    name: 세르벤 곡창
    danger: 1
    min: [-1500, -64, 600]
    max: [500, 320, 2200]
    priority: 10
    parent: central_plains
    tags: [farmland, plains, river]
    purpose: 대륙의 식량 창고. 요리 재료와 초보 사냥터
    resources: [wheat_sheaf, flax_fiber, salmon]
  calamor_ruins:
    name: 칼라모르 폐도
    source: CANON
    danger: 3
    min: [-800, 40, 2400]
    max: [400, 320, 3400]
    priority: 10
    parent: central_plains
    tags: [ruins]
    purpose: 무너진 왕도의 발굴 현장. 역사 기록 발견 · 고고학 의뢰 · 거대 보스 「무너진 파수거상」
    changed: 원작에서 하벤 제국에 멸망한 왕국의 도읍이, 대분열 때 다시 전쟁터가 되어 완전한 폐허가 됨. 지금은 새벽 기록관이 발굴 중
    resources: [sandstone_block, raw_gem]
    factions: [dawn_archive]
  fallen_crater:
    name: 추락 분화구
    danger: 4
    min: [1200, -64, 400]
    max: [2200, 320, 1400]
    priority: 10
    parent: central_plains
    tags: [sky, crater]
    purpose: 하늘섬 파편이 떨어진 둥근 호수와 기울어진 섬 조각 — 대륙 어디서나 보이는 랜드마크. 하늘 금속 산지
    resources: [sky_metal]
  emperor_aqueduct:
    name: 황제의 수로
    danger: 3
    min: [-1200, -64, -400]
    max: [1200, 39, 4600]
    priority: 12
    tags: [underground, ruins, deep]
    purpose: 통일 제국이 만든 지하 물길 · 창고 · 피난처. 하르덴 · 칼라모르 · 아스트라 아래를 잇는 수직 탐험 공간
    resources: [silver_ore, raw_gem]
  north_reach:
    name: 북부 고지
    source: SOURCE-BASED
    danger: 2
    min: [-3000, -64, -5000]
    max: [3000, 320, -2001]
    priority: 0
    tags: [highland, forest]
    purpose: 잿빛 겨울 뒤 다시 사람이 살기 시작한 서늘한 고지대. 목재 · 사냥
    resources: [highland_timber, hide]
  morata_free_city:
    name: 모라타 자유시
    source: CANON
    danger: 0
    min: [-400, 40, -4200]
    max: [400, 320, -3600]
    priority: 20
    parent: north_reach
    tags: [city, artisan]
    purpose: 장인과 예술가의 도시. 생산 길드 · 염료 · 대리석 거래, 북부 탐험 보급
    changed: 원작의 북부 마을이 잿빛 겨울의 피난민을 받아들이며 커져 어느 나라에도 속하지 않은 자유시가 됨. 옛 광장의 조각상은 풍화되어 「풍화의 정원」이 됨
    resources: [marble_block, indigo_dye, madder_dye]
    factions: [northern_artisans]
  thor_deep_hammer:
    name: 깊은 망치 (토르 산맥)
    source: CANON
    danger: 2
    min: [-3600, -64, -4600]
    max: [-2400, 320, -3400]
    priority: 15
    parent: north_reach
    tags: [mountain, city, deep]
    purpose: 계단식으로 파 들어간 광산 도시. 금속 · 보석 생산과 대장 기술의 중심
    changed: 원작의 드워프 왕국이 「망치 맹약」이라는 광산 도시 연합이 됨. 산 하나가 통째로 파였고 폐광은 몬스터 서식지
    resources: [iron_ore, copper_ore, silver_ore, raw_gem]
    factions: [hammer_pact]
  niflheim_wastes:
    name: 니플하임 빙원 폐허
    source: CANON
    danger: 5
    min: [-3000, -64, -6000]
    max: [3000, 320, -5001]
    priority: 5
    tags: [frozen, ruins]
    purpose: 얼음에 묻힌 옛 제국 도시. 서리 수정 · 고대 생물 · 거대 보스 「서리 군주의 껍데기」
    changed: 원작의 옛 제국 역사가 남은 땅이 잿빛 겨울로 얼음에 덮임. 얼음 위로 첨탑 꼭대기만 보인다
    resources: [frost_crystal]
  brent_highlands:
    name: 브렌트 고원
    source: CANON
    danger: 2
    min: [2500, -64, -1500]
    max: [4200, 320, 500]
    priority: 5
    tags: [highland, forest]
    purpose: 동로를 따라 펼쳐진 고원 숲. 목재 · 가죽 산지
    changed: 원작의 브렌트 왕국은 사라졌고, 고원 숲은 벌목 개척지가 됨
    resources: [highland_timber, hide]
  nehales_bastion:
    name: 네할레스 성채
    source: CANON
    danger: 0
    min: [3200, 40, -900]
    max: [3600, 320, -500]
    priority: 20
    parent: brent_highlands
    tags: [fortress]
    purpose: 동로를 지키는 요새이자 옛 왕도를 보러 오는 순례지
    changed: 원작에서 브렌트 왕국의 수도였던 성이 왕국이 사라진 뒤 교역로 요새로 바뀜
  rosaim_harbor:
    name: 로자임 항만 연합
    source: CANON
    danger: 1
    min: [4600, 40, -800]
    max: [5600, 320, 800]
    priority: 10
    tags: [city, coast, river]
    purpose: 어업 · 해상 교역 · 조선. 군도 · 난파선 탐험의 출발점
    changed: 원작의 동부 왕국이 무역으로 바닷가 항구 도시들의 연합이 됨
    resources: [salmon, sea_salt]
    factions: [rosaim_ports]
  eastern_sea:
    name: 동쪽 바다
    danger: 3
    min: [5601, -64, -6000]
    max: [6000, 320, 6000]
    priority: 1
    tags: [sea]
    purpose: 군도 · 난파선 · 해저 유적과 해양 보스 「심해 갑각왕」
    resources: [deep_eel, sea_salt]
  astra_academy:
    name: 아스트라 학술도시
    source: SOURCE-BASED
    danger: 0
    min: [-1200, 40, 3800]
    max: [-400, 320, 4600]
    priority: 20
    tags: [city, scholar]
    purpose: 공국 연맹이 세운 연구 도시. 연금 · 시약 · 유적 연구
    resources: [moonleaf, glass_sand]
    factions: [astra_academy]
  sand_sea:
    name: 모래바다
    source: SOURCE-BASED
    danger: 3
    min: [-3000, -64, 4401]
    max: [3000, 320, 6000]
    priority: 2
    tags: [desert]
    purpose: 남부의 사막. 소금 · 유리 모래 · 사막 가죽, 모래폭풍 이벤트와 보스 「사구 갈퀴웜」
    resources: [sandstone_block, glass_sand, saltroot]
  azil_oasis:
    name: 아질 오아시스
    danger: 0
    min: [400, 40, 5000]
    max: [1000, 320, 5600]
    priority: 20
    parent: sand_sea
    tags: [city, desert, market]
    purpose: 사막 한가운데 유일한 큰 샘에 대상단이 머물며 생긴 도시
    factions: [sand_caravan]
  buried_city:
    name: 매몰 도시
    danger: 5
    min: [1600, -64, 5400]
    max: [2400, 60, 6000]
    priority: 15
    parent: sand_sea
    tags: [ruins, desert, deep]
    purpose: 사구 아래 묻힌 옛 도시. 바람이 모래를 걷어 낼 때만 입구가 드러나는 발견 콘텐츠
  west_frontier:
    name: 서부 변경
    danger: 4
    min: [-6000, -64, -2000]
    max: [-2501, 320, 2600]
    priority: 2
    tags: [forest, frontier]
    purpose: 원작 자료가 부족한 서부를 새로 만든 미개척지. 지도에 없는 땅을 처음 밟는 탐험 콘텐츠
    resources: [highland_timber, moonleaf]
  risvel_outpost:
    name: 개척지 리스벨
    danger: 1
    min: [-2900, 40, -200]
    max: [-2500, 320, 200]
    priority: 20
    tags: [outpost]
    purpose: 문명의 서쪽 끝 목책 마을. 개척 의뢰와 보급
    factions: [settlers_council]
  mist_wall:
    name: 안개 장벽
    danger: 6
    min: [-6000, -64, -2000]
    max: [-5600, 320, 2600]
    priority: 10
    parent: west_frontier
    tags: [mist]
    purpose: 서쪽 끝을 가리는 이상한 안개. 현재 버전에서는 넘을 수 없는 경계 (향후 확장)
