name: VersaEra
version: '${version}'
main: io.versaera.platform.bukkit.VersaEraPlugin
api-version: '1.20'
description: 베르사 새벽기 — 『달빛조각사』 이후 시대를 무대로 한 독립형 MMORPG (팬 프로젝트, 비공식)
commands:
  versa:
    description: 캐릭터 · 지도
    aliases: [베르사]
  trade:
    description: 거래 요청 · 수락
    aliases: [거래]
  versaadmin:
    description: VersaEra 관리자
    aliases: [va]
    permission: versaera.admin
permissions:
  versaera.admin:
    description: 관리자 명령 (/versaadmin)
    default: op
